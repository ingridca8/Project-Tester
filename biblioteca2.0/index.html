<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Biblioteca</title>

  <!-- W3CSS -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  
  <!-- Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">

  <!-- TU CSS -->
  <link rel="stylesheet" href="./css/styles.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bgimg">

<div class="overlay">

  <div class="header">
    <h1>Biblioteca</h1>
    <p>mi colección personal</p>
  </div>

  <!-- stats -->
  <div class="stats">
    <div><h2 id="totalBooks">0</h2><p>Total</p></div>
    <div><h2 id="booksRead">0</h2><p>Leídos</p></div>
    <div><h2 id="booksReading">0</h2><p>Leyendo</p></div>
  </div>

  <input id="searchInput" placeholder="Buscar libros...">

  <div id="catalog" class="catalog"></div>

</div>

<!-- botón -->
<button id="fabBtn" class="w3-button w3-black fab">+</button>

<!-- modal -->
<div id="overlayForm" class="w3-modal">
  <div class="w3-modal-content w3-animate-zoom form-box">

    <form id="addForm">

      <input id="title" placeholder="Título" required>
      <input id="author" placeholder="Autor" required>

      <input id="genre" placeholder="Género">
      <input id="year" placeholder="Año">
      <input id="editorial" placeholder="Editorial">
      <input id="language" placeholder="Idioma">
      <input id="pages" placeholder="Páginas">
      <input id="isbn" placeholder="ISBN">
      <input id="grade" placeholder="Rating">

      <select id="status">
        <option>Unread</option>
        <option>Reading</option>
        <option>Read</option>
      </select>

      <textarea id="notes" placeholder="Notas"></textarea>

      <button class="w3-button w3-black">Guardar</button>

    </form>

  </div>
</div>

<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
