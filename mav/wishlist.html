<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotheca - Wishlist</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="nav-container">
        <nav>
            <button class="hamburger" aria-label="Menú">☰</button>
            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="biblioteca.html">Biblioteca</a>
                <a href="wishlist.html" class="active">Wishlist</a>
            </div>
        </nav>
    </div>

    <main>
        <h1 style="color: var(--gold); font-weight: 300; letter-spacing: 2px; margin-bottom: 1rem; text-align: center;">
            ⭐ Wishlist
        </h1>

        <div class="controls">
            <input type="text" id="searchInputWishlist" placeholder="🔍 Buscar...">
            <select id="genreFilterWishlist">
                <option value="">Todos los géneros</option>
            </select>
            <select id="yearFilterWishlist">
                <option value="">Todos los años</option>
            </select>
        </div>

        <div id="wishlistContainer" class="books-grid"></div>
    </main>

    <button class="fab" id="fabBtnWishlist" aria-label="Agregar a wishlist">+</button>

    <!-- Modal Wishlist -->
    <div class="modal-overlay" id="modalOverlayWishlist">
        <div class="modal-content">
            <button class="modal-close" id="closeModalWishlist">✕</button>
            <h2 id="modalTitleWishlist">Añadir a Wishlist</h2>
            
            <form id="addFormWishlist">
                <input type="hidden" id="editIdWishlist">
                
                <label for="titleWishlist">Título *</label>
                <input type="text" id="titleWishlist" required>
                
                <label for="authorWishlist">Autor *</label>
                <input type="text" id="authorWishlist" required>
                
                <label for="isbnWishlist">ISBN</label>
                <input type="text" id="isbnWishlist">
                
                <label for="yearWishlist">Año</label>
                <input type="number" id="yearWishlist">
                
                <label for="editorialWishlist">Editorial</label>
                <input type="text" id="editorialWishlist">
                
                <label for="notesWishlist">Notas</label>
                <textarea id="notesWishlist"></textarea>
                
                <button type="button" class="btn-save" id="saveBookBtnWishlist">💾 Guardar</button>
                <button type="button" class="btn-delete" id="deleteBookBtnWishlist" style="display:none;">🗑️ Eliminar</button>
            </form>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/main.js"></script>
    
</body>
</html>
