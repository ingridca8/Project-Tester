<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Biblioteca</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="page">

  <header>
    <h1>Biblioteca</h1>
    <p class="tagline">mi colección • biblioteca personal</p>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-owner="me">Mi biblioteca</button>
    <button class="tab" data-owner="mom">Mamá</button>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat"><h2 id="totalBooks">0</h2><p>Total</p></div>
    <div class="stat"><h2 id="booksRead">0</h2><p>Leídos</p></div>
    <div class="stat"><h2 id="booksReading">0</h2><p>Leyendo</p></div>
  </div>

  <main class="stage">

    <div class="controls">
      <input id="searchInput" placeholder="Buscar...">
      <select id="genreFilter"><option value="">Géneros</option></select>
      <select id="statusFilter">
        <option value="">Estados</option>
        <option>Unread</option>
        <option>Reading</option>
        <option>Read</option>
      </select>
    </div>

    <section id="catalog" class="catalog"></section>

  </main>
</div>

<button id="fabBtn" class="fab">+ Añadir</button>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Libro</h2>

    <form id="addForm">

      <input id="title" placeholder="Título" required>
      <input id="author" placeholder="Autor" required>

      <input id="isbn" placeholder="ISBN">
      <input id="year" type="number" placeholder="Año">

      <input id="editorial" placeholder="Editorial">
      <input id="language" placeholder="Idioma">
      <input id="pages" type="number" placeholder="Páginas">
      <input id="grade" type="number" min="1" max="5" placeholder="Rating">

      <select id="genre">
        <option value="">Género</option>
        <option>Ficción</option>
        <option>No Ficción</option>
        <option>Poesía</option>
      </select>

      <select id="status">
        <option>Unread</option>
        <option>Reading</option>
        <option>Read</option>
      </select>

      <textarea id="notes" placeholder="Notas"></textarea>

      <button type="submit">Guardar</button>

    </form>
  </div>
</div>

<script src="js/supabase.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
