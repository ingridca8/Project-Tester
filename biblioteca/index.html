<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Biblioteca</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="page">

  <header>
    <h1>Biblioteca</h1>
    <p class="tagline">mi colección personal</p>
  </header>

  <div class="stats">
    <div><h2 id="totalBooks">0</h2><p>Total</p></div>
    <div><h2 id="booksRead">0</h2><p>Leídos</p></div>
    <div><h2 id="booksReading">0</h2><p>Leyendo</p></div>
  </div>

  <div class="controls">
    <input id="searchInput" placeholder="Buscar libros...">
  </div>

  <div id="catalog" class="catalog"></div>

</div>

<button id="fabBtn">＋</button>

<!-- MODAL -->
<div id="overlay">
  <form id="addForm">

    <input id="title" placeholder="Título" required>
    <input id="author" placeholder="Autor" required>

    <input id="genre" placeholder="Género">
    <input id="year" placeholder="Año">

    <input id="editorial" placeholder="Editorial">
    <input id="language" placeholder="Idioma">
    <input id="pages" placeholder="Páginas">
    <input id="isbn" placeholder="ISBN">

    <input id="grade" placeholder="Rating (1-5)">
    
    <select id="status">
      <option>Unread</option>
      <option>Reading</option>
      <option>Read</option>
    </select>

    <textarea id="notes" placeholder="Notas"></textarea>

    <button>Guardar</button>
  </form>
</div>

<script src="js/supabase.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
